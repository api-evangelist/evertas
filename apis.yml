aid: evertas
name: Evertas
description: 'Evertas is a digital-asset insurance underwriter and the first company
  dedicated exclusively to crypto insurance. Founded in 2017 as BlockRe by J. Gdanski
  and Raymond Zenkich and rebranded to Evertas in 2020, it underwrites cryptocurrency
  mining and AI-infrastructure hardware property, platform failure, crime/theft/loss,
  insider theft/loss, digital property, and directors-and-officers risk. Products are
  underwritten by certain underwriters at Lloyd''s of London and other insurers, carry
  AM Best and Standard & Poor''s creditworthiness ratings, and offer coverage limits
  up to $600 million per declaration. Policies are distributed exclusively through
  appointed brokers. Evertas operates a marketing and content site plus an email-gated
  broker document-upload portal; it publishes no public API, developer portal, SDK,
  or machine-readable specification.'
